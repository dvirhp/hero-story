[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "storyforge-ai"
version = "0.1.0"
description = "Offline contracts and developmental profiles for a bilingual story engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-socket>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/storyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -ra"

