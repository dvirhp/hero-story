services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: storyforge_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: storyforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - storyforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge_local -d storyforge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  storyforge_pg:
